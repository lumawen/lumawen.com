# /etc/nginx/snippets/lumawen-headers.conf: security headers for the Lumawen sites.
# nginx drops server-level add_header lines in any location that has its own add_header,
# so locations that add headers include this file again.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
