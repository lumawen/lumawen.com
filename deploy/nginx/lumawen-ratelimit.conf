# /etc/nginx/conf.d/lumawen-ratelimit.conf (http context). Rate limits for the Lumawen API.
#
# One IPv4 address = one visitor. IPv6 is limited per /64, since one home or phone gets a whole
# /64 and could otherwise use a new address for every request. nginx writes IPv6 addresses
# shortest-form (lowercase, "::" for the longest run of 2+ zero groups), so the first four
# groups are read off the text; when "::" falls inside them, the missing zeros are put back.
map $remote_addr $lumawen_client {
    # No "::" in the first four groups: they are the /64.
    "~^(?<n>[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}):"                       $n;
    # "::" inside the first four groups; H = groups before it, T = groups after it.
    # 3 before: the 4th group is zero.
    "~^(?<n>[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4})::"                                    $n:0;
    # 2 before: groups 3 and 4 are zero.
    "~^(?<n>[0-9a-f]{1,4}:[0-9a-f]{1,4})::"                                                  $n:0:0;
    # 1 before, 5 after: the zeros are groups 2 and 3, the 4th is the first after "::".
    "~^(?<n>[0-9a-f]{1,4})::(?<g>[0-9a-f]{1,4})(:[0-9a-f]{1,4}){4}$"                         $n:0:0:$g;
    # 1 before, at most 4 after: groups 2 to 4 are zero.
    "~^(?<n>[0-9a-f]{1,4})::"                                                                $n:0:0:0;
    # 0 before, 6 after: groups 1 and 2 are zero, then the first two after "::".
    "~^::(?<g>[0-9a-f]{1,4}:[0-9a-f]{1,4})(:[0-9a-f]{1,4}){4}$"                              0:0:$g;
    # 0 before, 5 after: groups 1 to 3 are zero, then the first after "::".
    "~^::(?<g>[0-9a-f]{1,4})(:[0-9a-f]{1,4}){4}$"                                            0:0:0:$g;
    # 0 before, at most 4 after (::1 and the like).
    "~^::"                                                                                   0:0:0:0;
    # IPv4 (and anything else): the address itself.
    default                                                                                  $remote_addr;
}

limit_req_zone $lumawen_client zone=lumawen_auth:10m rate=10r/m;
limit_req_zone $lumawen_client zone=lumawen_api:10m rate=10r/s;
